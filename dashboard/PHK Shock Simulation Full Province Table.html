<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabel Lengkap Shock Simulation PHK</title>
<style>
:root{--navy:#0e2438;--line:#dde3ea;--surface:#fff;--canvas:#eef1f5;--ink:#1f2d3d;--muted:#64748b;--high:#d23b34;--low:#1f9d57;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;line-height:1.35}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 18px;box-shadow:0 2px 12px rgba(16,36,56,.18)}
h1{font-size:17px;margin:0 0 3px;font-weight:750}header p{margin:0;color:#cfe0f2;font-size:12px}.wrap{padding:16px 18px 30px;max-width:1500px;margin:0 auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px}.label{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.35px}.value{font-size:18px;font-weight:800;margin-top:3px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}input,button{border:1px solid var(--line);border-radius:6px;background:#fff;padding:7px 9px;font:inherit}input{min-width:260px;flex:1}button{cursor:pointer;color:var(--navy);font-weight:700}.tablebox{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 215px)}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:7px 8px;border-bottom:1px solid #e8edf3;vertical-align:middle;white-space:normal;word-break:normal}th{position:sticky;top:0;background:#f7f9fc;color:var(--muted);font-size:10px;text-align:left;text-transform:uppercase;letter-spacing:.3px;z-index:2}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.neg{color:var(--high);font-weight:750}.pos{color:var(--low);font-weight:750}.muted{color:var(--muted)}.empty{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;color:var(--muted)}
.col-prov{width:130px}.col-code{width:48px}.col-sector{width:230px}.col-pct{width:78px}.col-num{width:105px}.col-base{width:105px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:12px}.tablebox{max-height:none}body{font-size:11px}th,td{padding:6px}.col-sector{width:180px}}
</style>
</head>
<body>
<header>
  <h1>Tabel Lengkap Shock Simulation PHK</h1>
  <p id="subtitle">Membaca skenario aktif dari dashboard utama.</p>
</header>
<div class="wrap">
  <div id="empty" class="empty" style="display:none">Belum ada skenario. Buka halaman ini melalui tombol <b>Buka tabel lengkap</b> di tab Shock Simulation.</div>
  <div id="content" style="display:none">
    <div class="cards">
      <div class="card"><div class="label">Total dampak</div><div class="value" id="totalDelta">0</div></div>
      <div class="card"><div class="label">Cakupan</div><div class="value" id="coverage">-</div></div>
      <div class="card"><div class="label">Theme 1</div><div class="value" id="theme1">0</div></div>
      <div class="card"><div class="label">Theme 2 + 3</div><div class="value" id="theme23">0</div></div>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Cari provinsi atau sektor">
      <button id="download">Unduh CSV</button>
    </div>
    <div class="tablebox">
      <table id="fullTable">
        <thead><tr>
          <th class="col-prov">Provinsi</th><th class="col-code">Kode</th><th class="col-sector">Sektor</th><th class="num col-pct">% Impact</th><th class="num col-num">Delta pekerja</th><th class="num col-num">Theme 1</th><th class="num col-num">Theme 2</th><th class="num col-num">Theme 3</th><th class="num col-base">L0 lo.csv</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const raw = localStorage.getItem('phkShockFullTablePayload');
const fmtN = v => Math.round(v).toLocaleString('id-ID');
const fmt1 = v => Number(v).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const signedN = v => v===0 ? '0' : (v>0?'+':'') + fmtN(v);
const signedPct = v => v===0 ? '0' : (v>0?'+':'') + fmt1(v) + '%';
const cls = v => v<0 ? 'neg' : v>0 ? 'pos' : 'muted';
const esc = v => String(v ?? '').replace(/[&<>'"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
let payload;
try{ payload = raw ? JSON.parse(raw) : null; }catch(e){ payload = null; }
if(!payload || !payload.rows){
  document.getElementById('empty').style.display='block';
}else{
  document.getElementById('content').style.display='block';
  document.getElementById('subtitle').textContent = `${payload.provinceCount} provinsi × ${payload.sectorCount} sektor · filter pulau: ${payload.island==='all'?'semua':payload.island} · filter sektor: ${payload.sectorGroup}`;
  document.getElementById('totalDelta').textContent = signedN(payload.totals.delta);
  document.getElementById('totalDelta').className = 'value ' + cls(payload.totals.delta);
  document.getElementById('coverage').textContent = `${payload.provinceCount} provinsi`;
  document.getElementById('theme1').textContent = signedN(payload.totals.t1);
  document.getElementById('theme1').className = 'value ' + cls(payload.totals.t1);
  const theme23 = payload.totals.t2 + payload.totals.t3;
  document.getElementById('theme23').textContent = signedN(theme23);
  document.getElementById('theme23').className = 'value ' + cls(theme23);
  const tbody = document.querySelector('#fullTable tbody');
  function render(rows){
    tbody.innerHTML = rows.map(r=>`<tr><td>${esc(r.province)}</td><td>${r.sectorCode}</td><td>${esc(r.sector)}</td><td class="num ${cls(r.pct)}">${signedPct(r.pct)}</td><td class="num ${cls(r.delta)}">${signedN(r.delta)}</td><td class="num ${cls(r.t1)}">${signedN(r.t1)}</td><td class="num ${cls(r.t2)}">${signedN(r.t2)}</td><td class="num ${cls(r.t3)}">${signedN(r.t3)}</td><td class="num muted">${fmtN(r.employment)}</td></tr>`).join('');
  }
  render(payload.rows);
  document.getElementById('search').addEventListener('input', e=>{
    const q = e.target.value.trim().toLowerCase();
    render(q ? payload.rows.filter(r=>r.province.toLowerCase().includes(q)||r.sector.toLowerCase().includes(q)||String(r.sectorCode)===q) : payload.rows);
  });
  document.getElementById('download').addEventListener('click', ()=>{
    const head = ['province','sector_code','sector','pct_impact','delta_workers','theme1','theme2','theme3','baseline_lo_csv'];
    const csv = [head.join(',')].concat(payload.rows.map(r=>[r.province,r.sectorCode,r.sector,r.pct,r.delta,r.t1,r.t2,r.t3,r.employment].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))).join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'phk_shock_simulation_full_table.csv'; a.click(); URL.revokeObjectURL(a.href);
  });
}
</script>
</body>
</html>
