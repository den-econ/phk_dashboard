# ============================================================================
# PHK master dataset schema  —  description of every variable
# Master : data/clean/phk_master.csv   Grain: province x month (2022-01..2025-12)
# Source : Data untuk PHK Dashboard.xlsx only.  
# Built by: code/01_build_phk_master.do
#
# Naming: frequency is in the suffix (_q quarterly, _y annual, none = monthly);
#         geographic level is in the name (_nat = national, else province).
# ============================================================================
master_dataset: data/clean/phk_master.csv
grain: province-month
coverage: "2022-2025"
primary_key: [province_name_std, year, month]
source_workbook: "Data untuk PHK Dashboard.xlsx"
n_rows: 1824
n_columns: 226

# variables grouped by domain; each carries a description + metadata
variables:
  identity:
    - name: province_name_std
      description: "Province name (standardized) — merge key"
      frequency: key
      level: key
    - name: year
      description: "Calendar year (2022-2025)"
      frequency: key
      level: key
    - name: month
      description: "Calendar month (1-12)"
      frequency: key
      level: key
    - name: date
      description: "First day of the month (YYYY-MM-01)"
      frequency: key
      level: key
    - name: quarter
      description: "Calendar quarter (1-4)"
      frequency: key
      level: key
  phk:
    - name: phk_stock
      description: "Cumulative reported layoffs to date in the period"
      original_name: "PHK (Stock)"
      frequency: monthly
      level: province
    - name: phk_flow
      description: "New reported layoffs during the period"
      original_name: "PHK (Flow)"
      frequency: monthly
      level: province
    - name: phk_stock_q
      description: "Cumulative reported layoffs to date in the period"
      original_name: "PHK (Stock)"
      frequency: quarterly
      level: province
    - name: phk_flow_q
