# ============================================================================
# PHK master dataset schema  -  description of every variable
# Master : data/clean/phk_master.csv   Grain: province x month (2022-01..2025-12)
# Source : Data untuk PHK Dashboard.xlsx only.  MAP is NOT merged (reference only).
# Built by: code/01_build_phk_master.do
# Naming: _q quarterly, _y annual, none = monthly; _nat = national, else province.
# Variable list is identical to dictionary/indicator_dictionary.csv.
# ============================================================================
master_dataset: data/clean/phk_master.csv
grain: province-month
coverage: "2022-2025"
primary_key: [province_name_std, year, month]
source_workbook: "Data untuk PHK Dashboard.xlsx"
n_rows: 1824
n_columns: 257

variables:
  identity:
    - name: province_name_std
      description: "Provinsi (standardized)"
      data_period: "key"
      data_level: province
    - name: province_code
      description: "Kode Provinsi (BPS 2-digit, text)"
      data_period: "key"
      data_level: province
    - name: year
      description: "Tahun"
      data_period: "key"
      data_level: -
    - name: month
      description: "Bulan"
      data_period: "key"
      data_level: -
    - name: date
      description: "(derived) first day of month"
      data_period: "key"
      data_level: -
    - name: quarter
      description: "(derived) Triwulan"
      data_period: "key"
      data_level: -
